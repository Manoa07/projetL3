version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: projetl3-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: projetl3-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/app/upload/eleve_upload:/app/upload/eleve_upload
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    develop:
      watch:
        - action: sync
          path: ./Backend/app
          target: /app
        - action: rebuild
          path: ./requirements-backend.txt

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: projetl3-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
      API_BASE_URL: http://backend:8000
      QT_X11_NO_MITSHM: "1"
    volumes:
      - ./frontend/models:/app/models:ro
    stdin_open: true
    tty: true
    develop:
      watch:
        - action: sync+restart
          path: ./frontend
          target: /app
        - action: rebuild
          path: ./requirements-frontend.txt

volumes:
  pg_data:
